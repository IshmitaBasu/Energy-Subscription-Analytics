name: energy-subscription-analytics

services:
  metabase:
    image: metabase/metabase:v0.65.2
    container_name: esa-metabase
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Berlin
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  metabase-data:
    name: esa-metabase-data
