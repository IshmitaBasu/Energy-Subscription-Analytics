version: 2

sources:
  - name: energy_subscription_raw
    description: >-
      Deterministic synthetic source tables loaded into BigQuery with dbt seed.
      These tables imitate upstream operational extracts and contain no real
      customer data.
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    loader: dbt seed
    tables:
      - name: customers
        description: One row per synthetic energy customer.
        columns:
          - name: customer_id
            description: Stable synthetic customer identifier.
            data_tests:
              - not_null
              - unique
          - name: signup_date
            description: Date on which the customer signed up.
            data_tests:
              - not_null
          - name: customer_segment
            description: Synthetic commercial segment assigned to the customer.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["residential", "small_business"]
          - name: region
            description: ISO-style country code; fixed to DE in the first release.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["DE"]

      - name: tariffs
        description: One row per fixed electricity tariff.
        columns:
          - name: tariff_id
            description: Stable synthetic tariff identifier.
            data_tests:
              - not_null
              - unique
          - name: tariff_name
            description: Display name of the tariff.
            data_tests:
              - not_null
          - name: base_fee_eur_monthly
            description: Full-month tariff base fee in EUR before proration.
            data_tests:
              - not_null
          - name: unit_rate_eur_per_kwh
            description: Fixed tariff rate in EUR per kWh.
            data_tests:
              - not_null
          - name: region
            description: ISO-style country code; fixed to DE in the first release.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["DE"]

      - name: contracts
        description: One row per synthetic electricity contract.
        columns:
          - name: contract_id
            description: Stable synthetic contract identifier.
            data_tests:
              - not_null
              - unique
          - name: customer_id
            description: Customer that owns the contract.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('energy_subscription_raw', 'customers')
                    field: customer_id
          - name: tariff_id
            description: Tariff assigned to the contract.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('energy_subscription_raw', 'tariffs')
                    field: tariff_id
          - name: contract_start_date
            description: Inclusive service start date.
            data_tests:
              - not_null
          - name: contract_end_date
            description: Inclusive service end or cancellation date; null for active contracts.
          - name: contract_status
            description: Current synthetic lifecycle status at the end of the reporting fixture.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["active", "ended", "cancelled"]

      - name: monthly_consumption
        description: >-
          One observed row per contract and calendar month. Missing rows and null
          consumption values both represent unknown consumption; zero is measured.
        columns:
          - name: contract_id
            description: Contract associated with the consumption observation.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('energy_subscription_raw', 'contracts')
                    field: contract_id
          - name: consumption_month
            description: First calendar day of the observed consumption month.
            data_tests:
              - not_null
          - name: consumption_kwh
            description: Measured monthly kWh; null means consumption is unknown.

